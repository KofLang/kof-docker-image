name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Toda segunda-feira às 8h UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new Kof release
        id: check-release
        if: github.event_name == 'schedule'
        run: |
          # Pega a última release do Kof4j
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/KofLang/Kof4j/releases/latest | grep -o '"tag_name": "[^"]*"' | cut -d'"' -f4)
          echo "Latest release: $LATEST_RELEASE"
          
          # Salva a versão atual (se existir)
          if [ -f .last-release ]; then
            CURRENT_RELEASE=$(cat .last-release)
            echo "Current release: $CURRENT_RELEASE"
          else
            CURRENT_RELEASE=""
            echo "No previous release recorded"
          fi
          
          # Compara e define se deve fazer build
          if [ "$LATEST_RELEASE" != "$CURRENT_RELEASE" ]; then
            echo "New release detected!"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "$LATEST_RELEASE" > .last-release
          else
            echo "No new release"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Save new release version
        if: github.event_name == 'schedule' && steps.check-release.outputs.should_build == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          add: '.last-release'
          message: 'chore: update Kof release to ${{ steps.check-release.outputs.LATEST_RELEASE }}'
          default_author: github_actions
          push: true

      - name: Log in to GitHub Container Registry
        if: steps.check-release.outputs.should_build != 'false' || github.event_name != 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: steps.check-release.outputs.should_build != 'false' || github.event_name != 'schedule'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Set up Docker Buildx
        if: steps.check-release.outputs.should_build != 'false' || github.event_name != 'schedule'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check-release.outputs.should_build != 'false' || github.event_name != 'schedule'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
